<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolution Lab</title>
<meta name="description" content="Play the board game Evolution against measured computer players or friends online, with watering-hole odds, a threat map and trait data.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Evolution Lab">
<link rel="stylesheet" href="css/table.css?v=7">
<link rel="stylesheet" href="css/coach.css?v=9">
<link rel="stylesheet" href="css/profile.css?v=9">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --card-hover: #212636; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c; --plant: #5fae5a; --meat: #d0574a; --fat: #e9c46a;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button, input, select { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 8px 10px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* ------------------------------------------------ tab bar (phone bottom, laptop top) */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 12px 16px 12px; }
  }

  /* ------------------------------------------------ common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.red { background: #c9564a; border-color: #c9564a; color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 6px; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .qpop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .num { font-variant-numeric: tabular-nums; font-weight: 750; }
  .small { font-size: 12.5px; }
  .tok { vertical-align: -3px; flex: none; }
  .ti { display: block; }

  /* ------------------------------------------------ trait cards: real 63x88 cards (css/table.css .tbl-card)
     name across the top, the animal drawing in the middle, the plant-food leaf in the bottom-right corner */
  .tc, .tcf { --card-paper: var(--paper); color: #1b1d24; user-select: none; overflow: hidden; }
  .tc { --card-w: 62px; cursor: pointer; display: block; outline: 2px solid transparent; outline-offset: 1px;
    transition: transform .14s ease, box-shadow .14s, outline-color .14s, opacity .14s; }
  .tc:not(.tbl-back)::before, .tcf::before { content: ""; position: absolute; inset: calc(var(--card-w) * .05); border: 1.5px solid var(--ink);
    border-radius: calc(var(--card-w) * .045); pointer-events: none; opacity: .85; }
  .tc .tn, .tcf .tn { position: absolute; left: 10%; right: 8%; top: 8%; font-size: calc(var(--card-w) * .148); font-weight: 850; line-height: 1.02;
    color: var(--ink); text-align: center; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; letter-spacing: -.01em; }
  .tc .art, .tcf .art { position: absolute; left: 10%; right: 10%; top: 33%; bottom: 15%; border-radius: calc(var(--card-w) * .04); display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 90% 45% at 50% 108%, rgba(0,0,0,.13), transparent 70%), linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.12)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .tc .art .ti, .tcf .art .ti { width: 62%; height: auto; }
  .tc .fd, .tcf .fd { position: absolute; right: 3%; bottom: 2.5%; width: calc(var(--card-w) * .34); height: calc(var(--card-w) * .27); border-radius: 0 70% 0 70%;
    background: #2c5c28; color: #fff; font-size: calc(var(--card-w) * .17); font-weight: 850; display: flex; align-items: center; justify-content: center;
    font-variant-numeric: tabular-nums; box-shadow: 0 1px 2px rgba(0,0,0,.35); line-height: 1; }
  .tc .fd.neg, .tcf .fd.neg { background: #7d231b; }
  .tc .tx { display: none; }
  .tc.sel { outline-color: var(--accent-warm); }
  .tc.used { opacity: .3; }
  /* our own card back: earth brown with a leaf ring (no publisher art) */
  .tbl-back.evo-back { --back: #5a3d22; --back-frame: #3b2814; --ink: rgba(170,205,110,.4);
    background-image: radial-gradient(circle at 50% 50%, #8fbf5a 0 8%, transparent 8.5%), radial-gradient(circle at 50% 50%, transparent 0 19%, rgba(170,205,110,.55) 19.5% 23%, transparent 23.5% 31%, rgba(170,205,110,.3) 31.5% 33.5%, transparent 34%),
      repeating-linear-gradient(60deg, rgba(0,0,0,.13) 0 2px, transparent 2px 6px); }
  .tc.big { --card-w: 176px; cursor: default; }
  .tc.big .art { top: 22%; bottom: 46%; }
  .tc.big .art .ti { width: auto; height: 82%; }
  .tc.big .tx { display: block; position: absolute; left: 10%; right: 10%; top: 57%; bottom: 17%; font-size: 12px; line-height: 1.28; overflow: hidden; }
  .tc.big .fd { font-size: 20px; }
  .tc.big .tn { font-size: 19px; }
  @keyframes deal { from { transform: translateY(30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bite { 0% { transform: none; } 30% { transform: translateX(-4px) rotate(-2deg); } 60% { transform: translateX(4px) rotate(2deg); } 100% { transform: none; } }
  .deal { animation: deal .32s ease-out both; }
  .popin { animation: pop .3s ease-out both; }
  .bitten { animation: bite .45s ease-in-out; }

  /* ------------------------------------------------ species boards: cardboard boards with the Body size and
     Population tracks (1-6, a wooden cube on each), food tokens on the board, trait cards tucked above it */
  .sp { position: relative; flex: none; width: 94px; display: flex; flex-direction: column; cursor: pointer; border-radius: 8px;
    transition: outline-color .14s, transform .14s, opacity .2s; outline: 2px solid transparent; outline-offset: 2px; }
  .sp .trs { display: flex; flex-direction: column; justify-content: flex-end; padding: 0 5px; min-height: 58px; }
  .tr { position: relative; display: flex; align-items: center; gap: 3px; background: var(--paper); color: #1b1d24; border-radius: 5px 5px 0 0;
    padding: 2px 3px 4px 2px; margin-bottom: -2px; font-size: 9.6px; font-weight: 750; line-height: 1; min-height: 20px;
    border: 1px solid rgba(0,0,0,.45); border-bottom: 0; border-left: 3px solid var(--ink); box-shadow: 0 -1px 3px rgba(0,0,0,.35); overflow: hidden; }
  .tr .ti { width: 14px; height: 14px; flex: none; }
  .tr span { min-width: 0; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
  .tr.empty { background: rgba(0,0,0,.08); border: 1px dashed rgba(255,236,200,.15); border-bottom: 0; box-shadow: none; }
  .tr.hid { background-color: #5a3d22; background-image: radial-gradient(circle at 50% 50%, rgba(170,205,110,.5) 0 3px, transparent 3.5px), repeating-linear-gradient(60deg, rgba(0,0,0,.18) 0 2px, transparent 2px 6px);
    border-left-color: #3b2814; color: #d9c7a4; }
  .tr.new { outline: 1.5px dashed var(--accent-warm); outline-offset: -2px; }
  .sp .board { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 2px; padding: 4px 4px 4px; border-radius: 6px; color: #3b2c14;
    background: radial-gradient(ellipse 80% 60% at 30% 20%, rgba(255,255,255,.22), transparent 70%), linear-gradient(180deg, #d8c393, #c2a670);
    border: 1px solid #7b6235; box-shadow: 0 1px 0 #9b8050, 0 2px 0 #6e5630, 0 4px 8px rgba(0,0,0,.5); }
  .sp .fr { display: flex; flex-wrap: wrap; gap: 2px; min-height: 13px; justify-content: center; padding-bottom: 1px; }
  .ftk { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; --c: #5fae5a; --d: #2c5c28;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.4), transparent 45%), var(--c); box-shadow: 0 1px 0 var(--d), 0 2px 2px rgba(0,0,0,.4); }
  .ftk.meat { --c: #d0574a; --d: #7d231b; }
  .ftk.fat { --c: #e9c46a; --d: #8b6a14; border-radius: 3px; }
  .sp .slot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px dashed rgba(70,50,20,.45); }
  .sp .slot.fatslot { border-color: rgba(139,106,20,.75); border-radius: 3px; }
  .trk { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; align-items: center; }
  .trk .tl { grid-column: 1 / -1; font-size: 7.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 800; color: rgba(59,44,20,.75); line-height: 1; }
  .trk i { height: 13px; font-style: normal; font-size: 8px; font-weight: 700; color: rgba(59,44,20,.5); display: flex; align-items: center; justify-content: center;
    background: rgba(255,250,232,.38); border-radius: 2px; font-variant-numeric: tabular-nums; }
  .trk i.on { background: none; }
  .cube { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 15px; height: 15px; border-radius: 2px; background: var(--cube); color: #fff;
    font-size: 10.5px; font-weight: 850; font-style: normal; line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.35);
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.28), inset 1px 1px 0 rgba(255,255,255,.32), 1px 2px 2px rgba(0,0,0,.45); }
  .cube.b { --cube: #8a5a2b; } .cube.p { --cube: #3f8a3a; }
  .sp.can { outline-color: rgba(110,168,254,.95); }
  .sp.sel { outline-color: var(--accent-warm); transform: translateY(-3px); }
  .sp.fed .board { box-shadow: 0 0 0 2px rgba(110,200,90,.65), 0 2px 0 #6e5630, 0 4px 8px rgba(0,0,0,.5); }
  .sp.gone { opacity: .25; }
  .sp .flag { position: absolute; z-index: 2; top: -7px; right: -5px; min-width: 18px; height: 18px; border-radius: 9px; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .sp .flag.danger { background: var(--meat); color: #fff; }
  .sp .flag.carn { background: #7d231b; color: #fff; left: -5px; right: auto; }
  .sp.carnivore .board { background: radial-gradient(ellipse 80% 60% at 30% 20%, rgba(255,255,255,.2), transparent 70%), linear-gradient(180deg, #d9b597, #c0926f); border-color: #7a4430; }
  .newsp { flex: none; width: 46px; border: 2px dashed rgba(255,236,200,.3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,236,200,.6); font-size: 22px; cursor: pointer; background: rgba(0,0,0,.1); }
  .newsp.can { border-color: var(--accent); color: var(--accent); }
  /* my own first-player token and food bag, on the table beside my boards */
  .mine .side-bits { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 2px 4px; }
  .fp { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%; font: 850 9.5px/1 system-ui, sans-serif; color: #3b2a12; letter-spacing: -.02em;
    background: radial-gradient(closest-side, #e7c873 0 74%, #6b4f1c 76% 80%, #e7c873 82%); box-shadow: 0 2px 0 rgba(0,0,0,.3), 0 3px 0 #5d4a2a, 0 4px 5px rgba(0,0,0,.45); }
  .bag { position: relative; display: inline-flex; flex: none; width: 28px; height: 30px; filter: drop-shadow(1px 3px 2px rgba(0,0,0,.5)); }
  .bag svg { width: 100%; height: 100%; display: block; }
  .bag b { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 11px; font-weight: 850; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); font-variant-numeric: tabular-nums; }

  /* mini species (opponents): the same board in miniature, tiny card tops above it */
  .msp { flex: none; display: flex; flex-direction: column; align-items: stretch; cursor: pointer; border-radius: 5px; min-width: 44px; transition: outline-color .14s; outline: 2px solid transparent; outline-offset: 1px; }
  .msp .ics { display: flex; gap: 1px; justify-content: center; padding: 0 3px; margin-bottom: -2px; min-height: 0; }
  .msp .ics .ic, .msp .ics .hidden { width: 16px; height: 17px; flex: none; border-radius: 3px 3px 0 0; border: 1px solid rgba(0,0,0,.45); border-bottom: 0; box-shadow: 0 -1px 2px rgba(0,0,0,.3);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 1px; }
  .msp .ics .ic { background: var(--paper); border-top: 2px solid var(--ink); }
  .msp .ics .ti { width: 12px; height: 12px; }
  .msp .ics .hidden { background-color: #5a3d22; background-image: radial-gradient(circle at 50% 55%, rgba(170,205,110,.55) 0 2.5px, transparent 3px), repeating-linear-gradient(60deg, rgba(0,0,0,.18) 0 2px, transparent 2px 5px); }
  .msp .mb { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 2px; padding: 3px 4px; border-radius: 4px; color: #3b2c14;
    background: linear-gradient(180deg, #d8c393, #c2a670); border: 1px solid #7b6235; box-shadow: 0 1px 0 #6e5630, 0 3px 5px rgba(0,0,0,.45); }
  .msp.carnivore .mb { background: linear-gradient(180deg, #d9b597, #c0926f); border-color: #7a4430; }
  .msp .bp { display: flex; gap: 3px; align-items: center; justify-content: center; }
  .msp .bp .cube { width: 16px; height: 16px; font-size: 11px; }
  .msp .fdots { display: flex; flex-wrap: wrap; gap: 2px; max-width: 70px; justify-content: center; min-height: 7px; }
  .msp .fdots i { width: 7px; height: 7px; border-radius: 50%; border: 1px dashed rgba(70,50,20,.5); }
  .msp .fdots i.on { background: var(--plant); border: 0; box-shadow: 0 1px 0 #2c5c28; }
  .msp .fdots i.on.meat { background: var(--meat); box-shadow: 0 1px 0 #7d231b; }
  .msp .fdots i.fat { background: var(--fat); border: 0; border-radius: 1px; box-shadow: 0 1px 0 #8b6a14; }
  @keyframes prey { 0%, 100% { box-shadow: 0 0 0 2px rgba(240,106,90,.25); } 50% { box-shadow: 0 0 0 5px rgba(240,106,90,.38); } }
  .msp.can, .sp.prey { outline-color: #f06a5a; animation: prey 1.3s ease-in-out infinite; }
  /* a target on a crowded table: a few px of extra tap room around it (choosing it still needs the Attack button) */
  .msp.can { position: relative; z-index: 2; }
  .msp.can::after { content: ""; position: absolute; inset: -3px -2px; }
  .msp.tgt, .sp.tgt { outline-color: var(--accent-warm); box-shadow: 0 0 0 4px rgba(240,179,84,.3); animation: none; }
  .msp.gone { opacity: .25; }
  /* a trait card turned face up at the reveal: a quick 3-D turn */
  @keyframes flipin { 0% { transform: perspective(260px) rotateX(-90deg); opacity: .4; } 100% { transform: none; opacity: 1; } }
  .flipin { animation: flipin .5s cubic-bezier(.3,.7,.3,1) both; transform-origin: 50% 100%; }

  /* ------------------------------------------------ play layout: a wooden table seen from your seat.
     Opponents across the far side, the watering hole with the deck and discards in the middle,
     your species boards in front of you, your hand held at the bottom edge. */
  #v-play.tbl-surface { color: var(--text); }
  #game { flex: 1; min-height: 0; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, max-content) auto max-content minmax(96px, 1fr) auto; grid-template-areas: "status" "opps" "hole" "mine" "hand" "acts"; }
  .status { grid-area: status; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12.5px; }
  .status .ph { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .2s; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .status .ph.me { color: var(--accent-warm); }
  .pill { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #game .pill, #game .icon-btn { background: rgba(14,10,6,.45); border-color: rgba(255,236,200,.16); }
  .icon-btn { position: relative; width: 36px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; transition: transform .08s; }
  .icon-btn::after { content: ""; position: absolute; inset: -5px -2px; } /* 40x42 tap area without a taller bar */
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }
  /* opponents' places across the table: name plate, hand of card backs, food bag, their boards */
  .opps { grid-area: opps; display: flex; flex-direction: column; gap: 5px; overflow-y: auto; min-height: 0; }
  /* no box around a seat: just the name plate and that player's things on the wood (the plate glows on their turn) */
  .opp { background: none; border-radius: 10px; padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .opp .oh { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
  .opp .plate { display: inline-flex; align-items: center; gap: 5px; min-width: 0; flex: 0 1 auto; padding: 1px 7px; border-radius: 4px; color: #f6efdc;
    background: linear-gradient(#3b2a1a, #24180d); border: 1px solid #7a5a2e; box-shadow: inset 0 1px 0 rgba(255,220,150,.25), 0 2px 4px rgba(0,0,0,.4); line-height: 17px; }
  .opp.turn .plate { border-color: #f0c35a; box-shadow: 0 0 0 2px rgba(240,195,90,.45), 0 2px 4px rgba(0,0,0,.4); }
  .opp .oh .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
  .opp .oh .nmx { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tpick button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(110,168,254,.12); }
  .stepper { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-soft); cursor: pointer; font-weight: 800; }
  .stepper b { width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
  .verdict { font-size: 18px; font-weight: 800; }
  .verdict.yes { color: var(--bad); } .verdict.no { color: var(--good); }
  @media (min-width: 900px) {
    .lab .body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
  }

  /* ------------------------------------------------ study */
  .study { flex: 1; min-height: 0; display: grid; gap: 10px; grid-template-rows: auto auto minmax(0, 1fr); }
  .sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .sum .big { font-size: 20px; font-weight: 800; }
  table.turns { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.turns th { text-align: left; color: var(--muted); font-weight: 600; font-size: 11px; padding: 4px 5px; position: sticky; top: 0; background: var(--bg); }
  table.turns td { padding: 5px 5px; border-top: 1px solid #222838; vertical-align: top; }
  table.turns td.n { font-variant-numeric: tabular-nums; color: var(--muted); }
  table.turns tr.win td { color: var(--accent-warm); font-weight: 750; }
  .ok { color: var(--good); font-weight: 700; }
  .no { color: var(--bad); font-weight: 700; }
  @media (min-width: 900px) {
    .study { grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .study .s-head { grid-column: 1; }
    .study .s-chart { grid-column: 1; grid-row: 2; align-self: start; }
    .study .s-list { grid-column: 2; grid-row: 1 / 3; }
  }

  /* ------------------------------------------------ settings */
  .set { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .setrow .grow b { display: block; font-weight: 650; }
  .setrow .grow span { font-size: 12.5px; color: var(--muted); }
  .ver { color: #59607a; font-size: 12px; text-align: center; }
  .ver a { color: #59607a; }
  .confirm-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .confirm-back .panel { max-width: 360px; width: 100%; }
  #v-play { position: relative; }
  #over { position: absolute; z-index: 40; } /* the result card covers the table only, never the tabs */
  /* the result as a score pad on the table */
  #over .panel { background-color: #f4eedf; color: #2b2214; border-color: #c9b98f; box-shadow: 0 2px 0 #d6c8a4, 0 18px 40px rgba(0,0,0,.6);
    background-image: linear-gradient(90deg, transparent 22px, rgba(200,80,70,.35) 22px 23px, transparent 23px), repeating-linear-gradient(transparent 0 25px, rgba(70,110,170,.2) 25px 26px); }
  #over table.turns th { color: #6b5b3e; background: transparent; }
  #over table.turns td { border-top-color: rgba(60,40,10,.14); }
  #over table.turns td.n { color: #5c4d33; }
  #over table.turns tr.win td { color: #9a5b00; }
  #over .btn.ghost { color: #2b2214; border-color: rgba(60,40,10,.3); }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80; animation: up .2s; max-width: calc(100vw - 32px); }
  .fx { position: fixed; z-index: 55; pointer-events: none; transition: transform .45s cubic-bezier(.3,.7,.3,1), opacity .45s; }
  /* Settings > Sound & effects: Animations off stops the table's own motion too; Fast halves it */
  .fx-still .deal, .fx-still .flipin, .fx-still .popin, .fx-still .bitten, .fx-still .msp.can, .fx-still .sp.prey, .fx-still .sheet, .fx-still .sheet-back, .fx-still .toast { animation: none; }
  .fx-fast .deal, .fx-fast .popin { animation-duration: .17s; }
  .fx-fast .sheet, .fx-fast .sheet-back, .fx-fast .toast { animation-duration: .11s; }
  #over b[data-tot] { display: inline-block; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; } /* counting up never widens the column */
  #set-fx { display: flex; flex-direction: column; gap: 2px; }
  #set-fx .fx-row { border-top: 0; min-height: 46px; padding: 0; }
  /* the shared rows wear this site's own switch, segment and label look */
  #set-fx .fx-lab { font-weight: 650; }
  #set-fx .switch { width: 48px; height: 28px; }
  #set-fx .switch span { background: #2f3548; border-radius: 14px; }
  #set-fx .switch span::after { width: 22px; height: 22px; }
  #set-fx .switch input:checked + span { background: var(--accent); }
  #set-fx .switch input:checked + span::after { transform: translateX(20px); }
  #set-fx .seg { background: none; border: 0; padding: 0; gap: 6px; }
  #set-fx .seg button { min-height: 42px; min-width: 78px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 14px; padding: 4px 12px; }
  #set-fx .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  #set-fx .fx-test { min-height: 34px; border-radius: 8px; background: var(--card); font-size: 13.5px; }
  /* guided game + rules sheet (css/coach.css): the first-visit offer sits above the phone's tab bar; the rules'
     section tabs wrap instead of scrolling sideways on a phone; trait icons in the rules sit on their card colour */
  :root { --coach-offer-bottom: calc(var(--tabbar) + 10px + env(safe-area-inset-bottom)); }
  @media (min-width: 900px) { :root { --coach-offer-bottom: 18px; } }
  .coach-rules .coach-rules-nav { flex-wrap: wrap; overflow-x: visible; row-gap: 6px; }
  .coach-rules .ti { display: inline-block; width: 22px; height: 22px; vertical-align: -6px; }
  .coach-rules td:first-child { white-space: nowrap; }
  .pf-row .btn { min-width: 0; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
</style>
</head>
